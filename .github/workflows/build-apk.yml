name: Build PantryChef AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'pantrychef-ai.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Extract project ZIP
        run: unzip -q pantrychef-ai.zip -d project

            - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build APK
        run: |
          GRADLE_FILE=$(find project -type f -name gradlew | head -n 1)
          if [ -n "$GRADLE_FILE" ]; then
            PROJECT_DIR=$(dirname "$GRADLE_FILE")
            cd "$PROJECT_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            BUILD_GRADLE=$(find project -maxdepth 4 -name "build.gradle*" | head -n 1)
            if [ -z "$BUILD_GRADLE" ]; then
              echo "Android Gradle project not found in ZIP"
              exit 1
            fi
            PROJECT_DIR=$(dirname "$BUILD_GRADLE")
            cd "$PROJECT_DIR"
            gradle assembleDebug
          fi

          

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PantryChef-AI-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
